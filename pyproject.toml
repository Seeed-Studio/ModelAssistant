[build-system]
# PEP 517/660 build via setuptools. Without this, pip falls back to the
# deprecated legacy `setup.py egg_info`/`setup.py develop` path, which is
# removed in newer pip releases and fails on modern environments (e.g. Colab).
requires = ["setuptools>=64,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"


[tool.pylint.messages_control]
disable = "C0330, C0326"


[tool.pylint.format]
max-line-length = "120"


[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
skip-string-normalization = true


[tool.ruff]
line-length = 120
select = ["E", "F"]
ignore = ["E501"]
exclude = [
    ".eggs",
    ".git",
    ".github",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build/",
    "datasets/",
    "docs/",
    "examples/",
    "dist/",
    "node_modules/",
    "scripts/",
    "work_dirs/",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
target-version = "py38"


[tool.ruff.mccabe]
max-complexity = 10
